<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carriera Pilota</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="page-loader" class="page-loader active" aria-hidden="false">
  <div class="page-loader-inner">
    <img src="assets/logo-white.svg" alt="Cavallino" class="page-loader-horse">
    <div class="page-loader-spinner"></div>
  </div>
</div>

<header class="site-header">
  <div class="header-inner">
    <a class="header-back" href="index.html#standings" aria-label="Torna all'analisi">&larr; Analisi</a>
    <a class="brand" href="index.html" aria-label="Ferrari Season Analyzer">
      <span class="brand-shield">
        <img src="assets/logo-white.svg" alt="">
      </span>
      <span class="brand-text">
        <span class="brand-name">Scuderia Ferrari</span>
        <span class="brand-sub">Season Analyzer</span>
      </span>
    </a>
  </div>
</header>

<main id="top">
  <section class="hero hero-driver">
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-glow"></div>
      <div class="hero-grid"></div>
    </div>
    <div class="hero-content">
      <p class="hero-pretitle" id="driver-code">—</p>
      <h1 class="hero-title" id="driver-name">Caricamento...</h1>
      <p class="hero-sub" id="driver-nationality">—</p>
    </div>
    <div class="hero-stats" id="driver-stats"></div>
    <div class="driver-sprint-stats" id="driver-sprint-stats"></div>
  </section>

  <section class="section section-alt">
    <div class="content">
      <div class="section-head driver-chart-head">
        <div>
          <p class="eyebrow">Carriera</p>
          <h2>Distribuzione risultati</h2>
        </div>
        <div class="driver-chart-filters">
          <label class="driver-chart-filter" for="driver-chart-session">
            <span>Sessione</span>
            <select id="driver-chart-session" aria-label="Seleziona la sessione">
              <option value="race">Gara</option>
              <option value="qualifying">Qualifiche</option>
            </select>
          </label>
          <label class="driver-chart-filter" for="driver-chart-season">
            <span>Stagione</span>
            <select id="driver-chart-season" aria-label="Filtra per stagione">
              <option value="all">Tutte le stagioni</option>
            </select>
          </label>
        </div>
      </div>
      <div class="card driver-position-card"><div id="driver-position-chart"><p class="loading">Caricamento...</p></div></div>
    </div>
  </section>

  <section class="section">
    <div class="content driver-career-grid">
      <div class="driver-career-panel">
        <div class="section-head">
          <p class="eyebrow">Statistiche</p>
          <h2>Percentuali carriera</h2>
        </div>
        <div class="card driver-rate-card" id="driver-rate-stats"><p class="loading">Caricamento...</p></div>
      </div>
      <div class="driver-career-panel">
        <div class="section-head">
          <p class="eyebrow">Carriera</p>
          <h2>Stagioni</h2>
        </div>
        <div class="card" id="driver-seasons"><p class="loading">Caricamento...</p></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-legal">
    <p>Dati © Ergast Developer API · api.jolpi.ca</p>
  </div>
</footer>

<script type="module" src="driver.js"></script>
</body>
</html>
